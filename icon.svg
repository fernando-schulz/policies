<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0533"/>
      <stop offset="100%" stop-color="#5b1fa0"/>
    </linearGradient>
    <linearGradient id="play" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d8b4fe"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="100" height="100" rx="20" fill="url(#bg)"/>
  <!-- Outer subtle ring -->
  <circle cx="50" cy="50" r="36" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
  <!-- Inner filled circle (soft glow) -->
  <circle cx="50" cy="50" r="28" fill="rgba(255,255,255,0.06)"/>
  <!-- Play triangle -->
  <path d="M40 31 L40 69 L72 50 Z" fill="url(#play)"/>
  <!-- Small dot accent top-right -->
  <circle cx="72" cy="28" r="4" fill="rgba(255,255,255,0.35)"/>
</svg>
